<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Register</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>
</header>

<main>

<div class="login-container">

<h2>Student Registration</h2>

<form id="registration-form">

    <!-- Name -->
    <label>Full Name</label>
    <input type="text"
           id="fullname"
           placeholder="Enter Full Name"
           required
           pattern="[A-Za-z ]{2,50}">
    <small id="fullname-error" class="error-message"></small>

    <!-- Email -->
    <label>Email Address</label>
    <input type="email"
           id="email"
           placeholder="Enter Email Address"
           required>
    <small id="email-error" class="error-message"></small>

    <!-- Mobile -->
    <label>Mobile Number</label>
    <input type="tel"
           id="mobile"
           placeholder="Enter 10-digit Mobile Number"
           maxlength="10"
           required
           pattern="[6-9][0-9]{9}">
    <small id="mobile-error" class="error-message"></small>

    <!-- Password -->
    <label>Password</label>
    <input type="password"
           id="password"
           placeholder="Create Password"
           minlength="8"
           required>

    <small class="password-hint">
        Minimum 8 characters with uppercase, lowercase,
        number & special character.
    </small>

    <small id="password-error" class="error-message"></small>

    <!-- Confirm Password -->
    <label>Confirm Password</label>
    <input type="password"
           id="confirm-password"
           placeholder="Confirm Password"
           required>

    <small id="confirm-password-error" class="error-message"></small>

    <!-- Course -->
    <label>Course</label>
    <select id="course" required>
        <option value="">-- Select Course --</option>
        <option>Diploma IT</option>
        <option>Diploma CE</option>
        <option>B.Tech IT</option>
        <option>B.Tech CE</option>
        <option>BCA</option>
    </select>

    <small id="course-error" class="error-message"></small>

    <!-- Year -->
    <label>Year</label>
    <select id="year" required>
        <option value="">-- Select Year --</option>
        <option>1st Year</option>
        <option>2nd Year</option>
        <option>3rd Year</option>
        <option>4th Year</option>
    </select>

    <small id="year-error" class="error-message"></small>

    <!-- Gender -->
    <label>Gender</label>

    <div class="gender-options">
        <label><input type="radio" name="gender" value="Male" required> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Other"> Other</label>
    </div>

    <small id="gender-error" class="error-message"></small>

    <!-- Terms -->
    <div class="terms">
        <label>
            <input type="checkbox" id="terms" required>
            I agree to the Terms & Conditions
        </label>
    </div>

    <small id="terms-error" class="error-message"></small>

    <button type="submit">Register</button>

    <p id="registration-success" class="success-message"></p>

</form>

<div class="back-link">
    <a href="index.html">← Back to Home</a>
</div>

</div>

</main>

<footer>
    <p>&copy; 2026 StudentHub Portal. All Rights Reserved.</p>
</footer>

<script src="../js/script.js"></script>

</body>
</html>
